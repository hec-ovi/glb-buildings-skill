<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>building preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #0e1526;
        --line: #1f2b45;
        --ink: #e6edff;
        --muted: #7f8fb0;
        --accent: #ffb703;
        --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.55 var(--sans);
        overflow: hidden;
      }

      #panel {
        flex: none;
        width: 320px;
        height: 100%;
        overflow-y: auto;
        padding: 20px 18px 28px;
        background: var(--panel);
        border-right: 1px solid var(--line);
      }
      #stage { position: relative; flex: 1; min-width: 0; }
      #stage canvas { display: block; }

      .zone-rect {
        position: absolute;
        border: 1px solid var(--accent);
        background: #ffb70318;
        pointer-events: none;
      }

      .name { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
      .sub { color: var(--muted); font-family: var(--mono); font-size: 12px; margin-top: 3px; }

      .section { margin-top: 24px; }
      .section > h2 {
        margin: 0 0 10px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .band {
        display: grid;
        grid-template-columns: 10px 1fr;
        gap: 10px;
        align-items: start;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #121b30;
      }
      .band + .band { margin-top: 6px; }
      .band .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; }
      .band .id { font-weight: 600; }
      .band .meta { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }

      .segmented { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      .segmented button {
        flex: 1;
        font: inherit;
        color: var(--muted);
        background: #121b30;
        border: 0;
        padding: 7px 0;
        cursor: pointer;
      }
      .segmented button + button { border-left: 1px solid var(--line); }
      .segmented button:hover { color: var(--ink); }
      .segmented button[aria-pressed='true'] { background: var(--accent); color: #16110a; font-weight: 650; }

      .switch {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        margin-top: 8px;
        padding: 7px 10px;
        font: inherit;
        color: var(--ink);
        background: #121b30;
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
      }
      .switch:hover { border-color: #2c3d63; }
      .switch .state { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
      .switch[aria-pressed='true'] .state { color: var(--accent); }

      .count { font-family: var(--mono); font-size: 12px; color: var(--accent); }
      .ids {
        margin-top: 8px;
        max-height: 210px;
        overflow-y: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .ids span {
        padding: 2px 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: #121b30;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink);
      }
      .hint { color: var(--muted); font-size: 12px; }
      .path { margin-top: 10px; color: var(--muted); font-family: var(--mono); font-size: 11px; word-break: break-all; }
    </style>
  </head>
  <body>
    <aside id="panel"></aside>
    <div id="stage"></div>
  </body>
</html>
