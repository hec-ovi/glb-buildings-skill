<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>building preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0c0e;
        --panel: #121214;
        --raised: #17171a;
        --line: #26262b;
        --line-soft: #1d1d21;
        --ink: #ececee;
        --muted: #74757c;
        --accent: #f2622e;
        --accent-ink: #140800;
        --figure: #3ddc84;
        --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        grid-template-columns: 296px 1fr;
        grid-template-rows: 1fr auto;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.55 var(--sans);
        overflow: hidden;
      }

      h1, h2 { margin: 0; }
      h2 {
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .figure { color: var(--figure); font-family: var(--mono); }
      .hint { color: var(--muted); font-size: 11.5px; }

      /* the navigator down the side */
      #models {
        grid-row: 1 / 3;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--panel);
        border-right: 1px solid var(--line);
      }
      #models .head { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
      #models .title { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
      #models .rows { flex: 1; min-height: 0; overflow-y: auto; }
      #models .empty { padding: 18px; color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
      #models .total {
        padding: 12px 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
      }

      .row {
        display: block;
        width: 100%;
        padding: 13px 18px 14px;
        font: inherit;
        text-align: left;
        color: var(--ink);
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line-soft);
        border-left: 2px solid transparent;
        cursor: pointer;
      }
      .row:hover { background: var(--raised); }
      .row[aria-pressed='true'] { background: var(--raised); border-left-color: var(--accent); }
      .row[aria-pressed='true'] .row-name { color: var(--accent); }

      .row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
      .row-name { font-size: 14px; font-weight: 600; }
      .tag {
        padding: 1px 6px;
        border: 1px solid var(--line);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .tag.built { color: var(--figure); border-color: #23412f; }
      .row-figures { margin-top: 5px; color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
      .row-brief {
        margin-top: 7px;
        padding-left: 8px;
        border-left: 2px solid var(--line);
        color: var(--ink);
        font-size: 11.5px;
        font-style: italic;
        line-height: 1.45;
      }
      .row[aria-pressed='true'] .row-brief { border-left-color: var(--accent); }
      .row-reads { margin-top: 6px; color: var(--muted); font-size: 11.5px; line-height: 1.45; }

      /* the stage */
      #stage { position: relative; min-width: 0; min-height: 0; }
      #stage canvas { display: block; }
      .zone-rect {
        position: absolute;
        border: 1px solid var(--accent);
        background: #f2622e1f;
        pointer-events: none;
      }

      /* the building's own bar */
      #bar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(230px, 300px) minmax(250px, 320px);
        gap: 28px;
        align-items: start;
        padding: 14px 20px 16px;
        background: var(--panel);
        border-top: 1px solid var(--line);
      }
      .bar-block { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .bar-block.identity { gap: 4px; }
      .bar-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .bar-name { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
      .bar-size { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
      .bar-brief {
        margin-top: 2px;
        padding-left: 9px;
        border-left: 2px solid var(--line);
        color: var(--ink);
        font-size: 12px;
        font-style: italic;
        line-height: 1.5;
        max-width: 62ch;
      }
      .bar-brief:empty { display: none; }

      .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 30px;
        height: 26px;
        color: var(--muted);
        border: 1px solid var(--line);
        background: var(--raised);
      }
      .icon:hover { color: var(--accent); border-color: var(--accent); }
      .icon[aria-disabled='true'] { color: #3a3a42; cursor: not-allowed; }
      .icon[aria-disabled='true']:hover { color: #3a3a42; border-color: var(--line); }

      .row-line { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
      .of { color: var(--muted); font-family: var(--mono); font-size: 10.5px; }

      .walk { display: flex; align-items: stretch; }
      .arrow {
        flex: none;
        width: 28px;
        font: inherit;
        font-size: 15px;
        color: var(--muted);
        background: var(--raised);
        border: 1px solid var(--line);
        cursor: pointer;
      }
      .arrow:hover { color: var(--accent); border-color: var(--accent); }

      .one-section {
        display: grid;
        grid-template-columns: 8px 1fr;
        gap: 8px;
        align-items: center;
        flex: 1;
        min-width: 0;
        padding: 5px 10px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-left: 0;
        border-right: 0;
      }
      .one-section .dot { width: 8px; height: 8px; }
      .chip-id { font-weight: 600; font-size: 12px; }
      .chip-meta { color: var(--muted); font-family: var(--mono); font-size: 10.5px; white-space: nowrap; }

      .segmented { display: flex; border: 1px solid var(--line); }
      .segmented button {
        min-width: 62px;
        padding: 6px 12px;
        font: inherit;
        font-size: 12px;
        color: var(--muted);
        background: var(--raised);
        border: 0;
        cursor: pointer;
      }
      .segmented button + button { border-left: 1px solid var(--line); }
      .segmented button:hover { color: var(--ink); }
      .segmented button[aria-pressed='true'] { background: var(--accent); color: var(--accent-ink); font-weight: 650; }

      .action {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 6px 12px;
        font: inherit;
        font-size: 12px;
        color: var(--ink);
        text-decoration: none;
        background: var(--raised);
        border: 1px solid var(--line);
        cursor: pointer;
      }
      .action:hover { border-color: #3a3a42; }
      .action .state { color: var(--muted); font-family: var(--mono); font-size: 11px; }
      .action[aria-pressed='true'] { border-color: var(--accent); }
      .action[aria-pressed='true'] .state { color: var(--accent); }
      .action[aria-disabled='true'] { cursor: not-allowed; color: var(--muted); }
      .action[aria-disabled='true']:hover { border-color: var(--line); }

      .bar-block.right .read { margin-top: 4px; }
      .read { font-family: var(--mono); font-size: 11.5px; color: var(--ink); }
      .ids { display: flex; gap: 4px; overflow-x: auto; max-height: 24px; }
      .ids span {
        flex: none;
        padding: 1px 6px;
        background: var(--raised);
        border: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 10.5px;
      }
    </style>
  </head>
  <body>
    <aside id="models"><div class="head"><h1 class="title">Models</h1></div></aside>
    <div id="stage"></div>
    <footer id="bar"><div class="bar-block identity"><div class="bar-name">building preview</div><div class="bar-size">starting the viewer...</div></div></footer>
    <script type="module" src="/viewer.js"></script>
  </body>
</html>
